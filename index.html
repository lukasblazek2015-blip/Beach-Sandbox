<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sunny Shore — a tiny beach adventure</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-rounded, "Avenir Next", system-ui, sans-serif;
      --ink: #143747;
      --glass: rgba(255, 255, 255, .76);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      overflow: hidden;
      color: var(--ink);
      background: #91d7e7;
    }

    #scene {
      position: fixed;
      z-index: 0;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
    }

    .topbar {
      position: fixed;
      z-index: 2;
      top: 24px;
      left: 28px;
      display: flex;
      align-items: center;
      gap: 15px;
      pointer-events: none;
    }

    .sun-mark {
      display: grid;
      width: 58px;
      height: 58px;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, .72);
      border-radius: 16px;
      background: rgba(255, 255, 255, .35);
      font-size: 31px;
      backdrop-filter: blur(12px);
    }

    .title {
      margin: 0;
      font-size: 24px;
      font-weight: 850;
      letter-spacing: -.04em;
    }

    .subtitle {
      margin: 2px 0 0;
      color: rgba(20, 55, 71, .72);
      font-size: 14px;
      font-weight: 650;
      letter-spacing: .03em;
    }

    .hint {
      position: fixed;
      z-index: 2;
      top: 26px;
      right: 28px;
      width: 350px;
      padding: 18px 20px;
      border: 1px solid rgba(255, 255, 255, .75);
      border-radius: 18px;
      background: rgba(255, 255, 255, .9);
      box-shadow: 0 8px 26px rgba(29, 90, 103, .1);
      color: #295364;
      font-size: 14px;
      font-weight: 700;
      backdrop-filter: blur(14px);
    }
    .info-button {
      position: fixed;
      z-index: 2;
      top: 16px;
      right: 16px;
      padding: 13px 18px;
      border: 1px solid rgba(255, 255, 255, .82);
      border-radius: 13px;
      background: var(--glass);
      color: #31596a;
      font: inherit;
      font-size: 15px;
      font-weight: 800;
      box-shadow: 0 5px 16px rgba(29, 90, 103, .12);
      backdrop-filter: blur(14px);
      cursor: pointer;
    }
    .info-button:hover { background: white; }

    .hint-title {
      margin: 0 0 9px;
      color: #143747;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .control-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 14px;
      margin: 0;
    }
    .control-item {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 8px;
      color: #456b79;
      font-size: 13px;
      line-height: 1.2;
      white-space: nowrap;
    }
    .control-key {
      display: inline-grid;
      min-width: 26px;
      height: 25px;
      padding: 0 6px;
      place-items: center;
      border: 1px solid #d5e5e5;
      border-radius: 6px;
      background: white;
      color: #31596a;
      font-size: 12px;
      box-shadow: 0 2px 0 #dce8e7;
    }
    .hint-sub {
      display: block;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(115, 153, 160, .22);
      color: #5c7781;
      font-size: 12px;
      font-weight: 700;
    }

    kbd {
      display: inline-grid;
      min-width: 26px;
      height: 25px;
      margin: 0 1px;
      padding: 0 6px;
      place-items: center;
      border: 1px solid #d5e5e5;
      border-radius: 6px;
      background: white;
      color: #31596a;
      font: inherit;
      font-size: 12px;
      box-shadow: 0 2px 0 #dce8e7;
    }

    .controls {
      position: fixed;
      z-index: 2;
      right: 25px;
      bottom: 24px;
      display: grid;
      grid-template-columns: repeat(3, 56px);
      grid-template-rows: repeat(2, 56px);
      gap: 8px;
      touch-action: none;
    }

    .controls button {
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, .78);
      border-radius: 14px;
      background: var(--glass);
      color: #285466;
      font: inherit;
      font-size: 23px;
      box-shadow: 0 5px 16px rgba(29, 90, 103, .12);
      backdrop-filter: blur(14px);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .controls button:active { transform: translateY(2px); background: white; }
    .sprint-button {
      position: fixed;
      z-index: 2;
      right: 185px;
      bottom: 116px;
      min-width: 78px;
      height: 64px;
      padding: 0 15px;
      border: 1px solid rgba(255, 255, 255, .82);
      border-radius: 16px;
      background: var(--glass);
      color: #285466;
      font: inherit;
      font-size: 13px;
      font-weight: 850;
      box-shadow: 0 5px 16px rgba(29, 90, 103, .12);
      backdrop-filter: blur(14px);
      touch-action: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .sprint-button[aria-pressed="true"] { background: #fff1d2; transform: translateY(2px); }
    .dive-button {
      position: fixed;
      z-index: 2;
      right: 25px;
      bottom: 130px;
      min-width: 112px;
      padding: 13px 16px;
      border: 1px solid rgba(255, 255, 255, .82);
      border-radius: 14px;
      background: var(--glass);
      color: #285466;
      font: inherit;
      font-size: 14px;
      font-weight: 800;
      box-shadow: 0 5px 16px rgba(29, 90, 103, .12);
      backdrop-filter: blur(14px);
      cursor: pointer;
    }

    .dive-button:disabled { opacity: .48; cursor: default; }
    .dive-button:not(:disabled):hover { background: white; }

    .inspect-button {
      position: fixed;
      z-index: 2;
      left: 28px;
      bottom: 76px;
      padding: 13px 18px;
      border: 1px solid rgba(255, 255, 255, .82);
      border-radius: 14px;
      background: var(--glass);
      color: #285466;
      font: inherit;
      font-size: 14px;
      font-weight: 800;
      box-shadow: 0 5px 16px rgba(29, 90, 103, .12);
      backdrop-filter: blur(14px);
      cursor: pointer;
    }
    .inspect-button:disabled { opacity: .48; cursor: default; }
    .inspect-button[aria-pressed="true"] { background: #e5f4dd; }

    .inventory {
      position: fixed;
      z-index: 2;
      top: 80px;
      right: 28px;
      width: 350px;
      min-height: 122px;
      padding: 18px 20px;
      border: 1px solid rgba(255, 255, 255, .78);
      border-radius: 18px;
      background: rgba(255, 255, 255, .9);
      box-shadow: 0 8px 26px rgba(29, 90, 103, .1);
      backdrop-filter: blur(14px);
    }
    .inventory-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    .inventory-title { margin: 0; font-size: 16px; font-weight: 900; }
    .inventory-count {
      padding: 4px 8px;
      border-radius: 999px;
      background: #e8f4ef;
      color: #3c7267;
      font-size: 12px;
      font-weight: 850;
      white-space: nowrap;
    }
    .inventory-items { display: flex; flex-wrap: wrap; gap: 6px; }
    .inventory-chip {
      padding: 5px 8px;
      border: 1px solid rgba(201, 222, 220, .85);
      border-radius: 9px;
      background: rgba(255, 255, 255, .72);
      color: #31596a;
      font-size: 13px;
      font-weight: 750;
    }
    .inventory-empty { color: #65818a;     font-size: 13px; }
    .pickup-button {
      position: fixed;
      z-index: 3;
      left: 50%;
      bottom: 28px;
      padding: 15px 20px;
      border: 1px solid rgba(255, 255, 255, .9);
      border-radius: 14px;
      background: #fff8df;
      color: #31596a;
      font: inherit;
      font-size: 14px;
      font-weight: 850;
      box-shadow: 0 6px 20px rgba(29, 90, 103, .2);
      transform: translateX(-50%);
      cursor: pointer;
    }
    .pickup-button[hidden] { display: none; }

    #underwater-overlay {
      position: fixed;
      z-index: 1;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      background:
        radial-gradient(ellipse at 50% 12%, rgba(119, 224, 222, .18), transparent 62%),
        linear-gradient(180deg, rgba(10, 106, 143, .46), rgba(7, 62, 105, .58));
      transition: opacity .35s ease;
    }
    #underwater-overlay.active { opacity: 1; }

    #up { grid-column: 2; grid-row: 1; }
    #left { grid-column: 1; grid-row: 2; }
    #down { grid-column: 2; grid-row: 2; }
    #right { grid-column: 3; grid-row: 2; }

    .reset {
      position: fixed;
      z-index: 2;
      left: 28px;
      bottom: 27px;
      padding: 13px 18px;
      border: 1px solid rgba(255, 255, 255, .75);
      border-radius: 13px;
      background: var(--glass);
      color: #31596a;
      font: inherit;
      font-size: 14px;
      font-weight: 750;
      cursor: pointer;
      backdrop-filter: blur(14px);
    }

    .reset:hover { background: white; }

    @media (min-width: 760px) {
      .controls, .sprint-button { display: none; }
    }

    @media (min-width: 900px) {
      .topbar { top: 28px; left: 32px; }
      .sun-mark { width: 64px; height: 64px; }
      .title { font-size: 28px; }
      .subtitle { font-size: 15px; }
      .info-button { top: 96px; left: 32px; right: auto; }
      .hint { top: 148px; left: 32px; right: auto; }
      .inventory { top: 82px; right: 32px; }
      .inspect-button { left: 32px; bottom: 30px; }
      .reset { left: 225px; bottom: 30px; }
      .dive-button { right: 32px; bottom: 30px; }
      .pickup-button { bottom: 30px; }
    }

    @media (min-width: 900px) and (max-width: 1400px) {
      .dive-button { right: auto; left: 390px; bottom: 30px; }
    }

    @media (min-width: 541px) and (max-width: 899px) {
      .info-button { top: 24px; right: 16px; }
      .hint {
        top: 88px;
        left: 16px;
        right: auto;
        width: min(350px, calc(56vw - 24px));
        padding: 16px;
      }
      .control-list { gap: 9px 8px; }
      .control-item { gap: 6px; font-size: 12px; }
      .control-key { min-width: 24px; }
      .inventory {
        top: 88px;
        right: 16px;
        left: auto;
        width: min(280px, calc(44vw - 20px));
      }
      .inventory-heading { align-items: flex-start; flex-direction: column; gap: 7px; }
    }

    @media (min-width: 541px) and (max-width: 759px) {
      .controls { right: 16px; bottom: 16px; }
      .sprint-button { right: auto; left: 16px; bottom: 180px; }
      .dive-button { right: 16px; bottom: 196px; }
    }

    @media (max-width: 540px) {
      .topbar { top: 16px; left: 16px; gap: 10px; }
      .sun-mark { width: 46px; height: 46px; font-size: 25px; }
      .title { font-size: 21px; }
      .subtitle { display: none; }
      .info-button { top: 76px; left: 12px; right: auto; }
      .hint {
        top: 132px;
        left: 12px;
        right: auto;
        width: min(230px, calc(52vw - 20px));
        padding: 14px 12px;
      }
      .hint-title { margin-bottom: 9px; font-size: 12px; }
      .control-list { grid-template-columns: 1fr; gap: 8px; }
      .control-item { gap: 7px; font-size: 12px; }
      .control-item kbd, .control-key { min-width: 27px; height: 23px; padding: 0 5px; font-size: 11px; }
      .hint-sub { margin-top: 9px; padding-top: 8px; font-size: 11px; }
      .reset { bottom: 132px; left: 16px; }
      .inspect-button { bottom: 190px; left: 16px; }
      .controls {
        right: 16px;
        bottom: 16px;
        grid-template-columns: repeat(3, 54px);
        grid-template-rows: repeat(2, 54px);
        gap: 7px;
      }
      .sprint-button { right: auto; left: 16px; bottom: 250px; }
      .dive-button { right: 16px; bottom: 145px; }
      .inventory {
        top: 76px;
        right: 12px;
        left: auto;
        width: min(180px, calc(48vw - 12px));
        min-height: 0;
        padding: 14px 12px;
      }
      .inventory-heading { align-items: flex-start; flex-direction: column; gap: 7px; margin-bottom: 9px; }
      .inventory-title { font-size: 14px; }
      .inventory-count { padding: 4px 7px; font-size: 11px; }
      .inventory-items { gap: 6px; }
      .inventory-chip { padding: 5px 7px; font-size: 11px; }
      .inventory-empty { font-size: 11px; }
      .pickup-button { bottom: 130px; max-width: calc(100vw - 32px); }
    }
  </style>
</head>
<body>
  <canvas id="scene" aria-label="A 3D beach where you can move a little character"></canvas>
  <header class="topbar">
    <div class="sun-mark" aria-hidden="true">☀️</div>
    <div>
      <h1 class="title">Sunny Shore</h1>
      <p class="subtitle">Explore the shore · Find beach treasures</p>
    </div>
  </header>
  <button class="info-button" id="information" type="button" aria-controls="game-controls" aria-expanded="false">Information</button>
  <aside class="hint" id="game-controls" aria-label="Game controls" hidden>
    <h2 class="hint-title">Controls</h2>
    <div class="control-list">
      <div class="control-item"><kbd>W / ↑</kbd><span>Walk forward</span></div>
      <div class="control-item"><kbd>A/D · ↶↷</kbd><span>Turn</span></div>
      <div class="control-item"><kbd>S / ↓</kbd><span>Slow reverse</span></div>
      <div class="control-item"><kbd>Shift</kbd><span>Sprint</span></div>
      <div class="control-item"><kbd>I</kbd><span>Inspect sand</span></div>
      <div class="control-item"><kbd>E</kbd><span>Pick up find</span></div>
      <div class="control-item"><kbd>U</kbd><span>Dive / surface</span></div>
      <div class="control-item"><span class="control-key">↺</span><span>Reset beach</span></div>
    </div>
    <span class="hint-sub">Find small shells, glass and starfish on the sand.</span>
  </aside>
  <div id="underwater-overlay" aria-hidden="true"></div>
  <aside class="inventory" aria-label="Beach finds inventory">
    <div class="inventory-heading">
      <h2 class="inventory-title">Beach finds</h2>
      <span class="inventory-count" id="inventory-count" aria-live="polite">0 found</span>
    </div>
    <div class="inventory-items" id="inventory-items"><span class="inventory-empty">Nothing collected yet</span></div>
  </aside>
  <button class="inspect-button" id="inspect" type="button" aria-label="Inspect the sand" aria-pressed="false" disabled><kbd>I</kbd> &nbsp; Inspect sand</button>
  <button class="pickup-button" id="pickup" type="button" aria-label="Pick up nearby find" hidden></button>
  <button class="dive-button" id="dive" type="button" aria-label="Dive underwater" disabled><kbd>U</kbd> &nbsp; Dive</button>
  <button class="sprint-button" id="sprint" type="button" aria-label="Hold to sprint" aria-pressed="false">RUN</button>
  <button class="reset" id="reset" type="button" aria-label="Reset to the starting beach">↺ &nbsp;Reset beach</button>
  <div class="controls" aria-label="Touch movement controls">
    <button id="up" type="button" aria-label="Move forward">↑</button>
    <button id="left" type="button" aria-label="Turn left">↶</button>
    <button id="down" type="button" aria-label="Move backward">↓</button>
    <button id="right" type="button" aria-label="Turn right">↷</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.min.js"></script>
  <script>
    (() => {
      const canvas = document.querySelector("#scene");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.15;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color("#9bd9e7");
      scene.fog = new THREE.Fog("#b7e5e8", 55, 165);

      const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 280);
      const cameraFollowDistance = 13.5;
      const cameraFollowHeight = 8.5;

      scene.add(new THREE.HemisphereLight("#e7fbff", "#d0a66d", 2.15));
      const sunLight = new THREE.DirectionalLight("#fff1c8", 3.1);
      sunLight.position.set(-8, 18, 8);
      sunLight.castShadow = true;
      sunLight.shadow.mapSize.set(2048, 2048);
      sunLight.shadow.camera.left = -55;
      sunLight.shadow.camera.right = 55;
      sunLight.shadow.camera.top = 55;
      sunLight.shadow.camera.bottom = -55;
      sunLight.shadow.bias = -0.0004;
      scene.add(sunLight);

      const mat = (color, roughness = 1) => new THREE.MeshStandardMaterial({ color, roughness });
      const sandTextureCanvas = document.createElement("canvas");
      sandTextureCanvas.width = 512;
      sandTextureCanvas.height = 512;
      const sandTextureContext = sandTextureCanvas.getContext("2d");
      const sandImage = sandTextureContext.createImageData(512, 512);
      for (let i = 0; i < sandImage.data.length; i += 4) {
        const grain = 224 + Math.random() * 27;
        sandImage.data[i] = grain;
        sandImage.data[i + 1] = grain;
        sandImage.data[i + 2] = grain - 7;
        sandImage.data[i + 3] = 255;
      }
      sandTextureContext.putImageData(sandImage, 0, 0);
      for (let i = 0; i < 6000; i++) {
        const x = Math.random() * 512;
        const y = Math.random() * 512;
        sandTextureContext.fillStyle = i % 4 === 0 ? "rgba(130, 102, 62, 0.14)" : "rgba(255, 248, 224, 0.22)";
        sandTextureContext.beginPath();
        sandTextureContext.ellipse(x, y, 0.4 + Math.random() * 2.2, 0.3 + Math.random() * 1.1, Math.random() * 0.5, 0, Math.PI * 2);
        sandTextureContext.fill();
      }
      const sandTexture = new THREE.CanvasTexture(sandTextureCanvas);
      sandTexture.colorSpace = THREE.SRGBColorSpace;
      sandTexture.wrapS = THREE.RepeatWrapping;
      sandTexture.wrapT = THREE.RepeatWrapping;
      sandTexture.repeat.set(48, 70);
      sandTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      const sandMat = new THREE.MeshStandardMaterial({
        roughness: 0.96, vertexColors: true, map: sandTexture, bumpMap: sandTexture, bumpScale: 0.11
      });
      const wetSandMat = mat("#c9bd91");
      let waterShader;
      const waterMat = new THREE.MeshPhysicalMaterial({
        vertexColors: true, roughness: 0.2, metalness: 0.04,
        clearcoat: 0.8, clearcoatRoughness: 0.18
      });
      waterMat.onBeforeCompile = (shader) => {
        waterShader = shader;
        shader.uniforms.uTime = { value: 0 };
        shader.vertexShader = shader.vertexShader
          .replace("#include <common>", "#include <common>\nuniform float uTime;")
          .replace(
            "#include <beginnormal_vertex>",
            `#include <beginnormal_vertex>
             float phaseA = position.x * 0.16 + position.y * -0.12 + uTime * 0.85;
             float phaseB = position.x * 0.31 + position.y * 0.18 + 49.0 - uTime * 1.1;
             float slopeX = 0.012 * cos(phaseA) + 0.01085 * cos(phaseB);
             float slopeY = -0.009 * cos(phaseA) + 0.0063 * cos(phaseB);
             objectNormal = normalize(vec3(-slopeX, -slopeY, 1.0));`
          )
          .replace(
            "#include <begin_vertex>",
            `#include <begin_vertex>
             transformed.z += 0.075 * sin(position.x * 0.16 + position.y * -0.12 + uTime * 0.85)
               + 0.035 * sin(position.x * 0.31 + position.y * 0.18 + 49.0 - uTime * 1.1);`
          );
      };
      const shoreZ = (x) => 1.4 + Math.sin(x * 0.14) * 0.42 + Math.sin(x * 0.33) * 0.16;
      const terrainHeight = (x, z) => {
        const dunes = THREE.MathUtils.smoothstep(z, 5, 13);
        const duneHills =
          2.6 * Math.exp(-(((x + 7) / 5) ** 2 + ((z - 9) / 5) ** 2)) +
          2.6 * Math.exp(-(((x - 7) / 5) ** 2 + ((z - 11) / 5) ** 2)) +
          3.2 * Math.exp(-(((x + 27) / 9) ** 2 + ((z - 27) / 9) ** 2)) +
          3.2 * Math.exp(-(((x - 29) / 10) ** 2 + ((z - 35) / 9) ** 2));
        return dunes * (
          0.75 * Math.sin(x * 0.18 + z * 0.1) +
          0.38 * Math.sin(z * 0.32 - x * 0.14) +
          0.65 * Math.sin(x * 0.08 + z * 0.06) +
          duneHills
        );
      };
      const terrainGeometry = new THREE.BufferGeometry();
      const terrainPositions = [];
      const terrainColors = [];
      const terrainUvs = [];
      const terrainIndices = [];
      const terrainWidthSegments = 140;
      const terrainDepthSegments = 140;
      const sandColor = new THREE.Color("#f1d49e");
      const dampSandColor = new THREE.Color("#dfc28b");
      const duneColor = new THREE.Color("#ccaa70");
      for (let iz = 0; iz <= terrainDepthSegments; iz++) {
        const depthRatio = iz / terrainDepthSegments;
        for (let ix = 0; ix <= terrainWidthSegments; ix++) {
          const x = -90 + (ix / terrainWidthSegments) * 180;
          const z = shoreZ(x) + depthRatio * 140;
          const height = terrainHeight(x, z);
          terrainPositions.push(x, height - 0.025, z);
          terrainUvs.push(ix / terrainWidthSegments, depthRatio);
          const color = sandColor.clone()
            .lerp(dampSandColor, Math.max(0, 1 - depthRatio * 18) * 0.68)
            .lerp(duneColor, THREE.MathUtils.clamp(height / 2.2, 0, 0.48));
          const grain = 0.96 + 0.04 * Math.sin(x * 0.39 + z * 0.24);
          terrainColors.push(color.r * grain, color.g * grain, color.b * grain);
          if (iz < terrainDepthSegments && ix < terrainWidthSegments) {
            const a = iz * (terrainWidthSegments + 1) + ix;
            const b = a + terrainWidthSegments + 1;
            terrainIndices.push(a, b, a + 1, b, b + 1, a + 1);
          }
        }
      }
      terrainGeometry.setAttribute("position", new THREE.Float32BufferAttribute(terrainPositions, 3));
      terrainGeometry.setAttribute("color", new THREE.Float32BufferAttribute(terrainColors, 3));

      function seededRandom(seed) {

          return state / 4294967296;

      function createWorldChunk(chunkXIndex, chunkZIndex) {
        const root = new THREE.Group();
        const chunkKey = `${chunkXIndex}:${chunkZIndex}`;
        root.userData.worldChunkKey = chunkKey;
        const xStart = chunkXIndex * worldChunkWidth - worldChunkWidth / 2;
        const startOffset = (chunkXIndex === 0 ? firstChunkOffset : 0) + chunkZIndex * chunkLength;
        const widthSegments = terrainWidthSegments;
        const depthSegments = 40;
        const positions = [];
        const colors = [];
        const uvs = [];
        const indices = [];
        for (let iz = 0; iz <= depthSegments; iz++) {
          const depthRatio = iz / depthSegments;
          const offset = startOffset + depthRatio * chunkLength;
          for (let ix = 0; ix <= widthSegments; ix++) {
            const x = xStart + (ix / widthSegments) * worldChunkWidth;
            const z = shoreZ(x) + offset;
            const height = terrainHeight(x, z);
            positions.push(x, height - 0.025, z);
            uvs.push((x + 90) / 180, offset / 140);
            const color = sandColor.clone().lerp(duneColor, THREE.MathUtils.clamp(height / 2.2, 0, 0.48));
            const grain = 0.96 + 0.04 * Math.sin(x * 0.39 + z * 0.24);
            colors.push(color.r * grain, color.g * grain, color.b * grain);
            if (iz < depthSegments && ix < widthSegments) {
              const a = iz * (widthSegments + 1) + ix;
              const b = a + widthSegments + 1;
              indices.push(a, b, a + 1, b, b + 1, a + 1);
            }
          }
        }
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
        geometry.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
        geometry.setAttribute("uv", new THREE.Float32BufferAttribute(uvs, 2));
        geometry.setIndex(indices);
        geometry.computeVertexNormals();
        const terrain = new THREE.Mesh(geometry, sandMat);
        terrain.receiveShadow = true;
        root.add(terrain);

        const random = seededRandom((Math.imul(chunkXIndex, 73856093) ^ Math.imul(chunkZIndex, 19349663)) + 19731);
        for (let i = 0; i < 6; i++) {
          const x = xStart + 6 + random() * 168;
          const z = shoreZ(x) + startOffset + 8 + random() * (chunkLength - 16);
          addPalm(x, z, 0.62 + random() * 0.25, root);

        const umbrellaColors = [
          ["#ee7965", "#fff1d2"], ["#56a9bd", "#fff1d2"],
          ["#f1bd57", "#fff2d6"], ["#6e9cb5", "#fff1d2"]

          const colorIndex = Math.floor(random() * umbrellaColors.length);
          addUmbrella(x, z, umbrellaColors[colorIndex], towelColors[colorIndex], root);
        }
        addGeneratedBeachDetails(root, xStart, startOffset, random);
        for (let i = 0; i < 32; i++) {
          const x = xStart + 4 + random() * 172;
          const z = shoreZ(x) + startOffset + 4 + random() * (chunkLength - 8);
          createGeneratedCollectible(root, chunkKey, i, collectibleTypes[i % collectibleTypes.length][0], x, z, random);
        }
        scene.add(root);
        worldChunks.set(chunkKey, root);

      function removeWorldChunk(chunkKey) {
        const root = worldChunks.get(chunkKey);

        scene.remove(root);

        const neededChunks = new Set();
        const firstX = Math.floor((worldX - 45 + worldChunkWidth / 2) / worldChunkWidth);

        for (let chunkXIndex = firstX; chunkXIndex <= lastX; chunkXIndex++) {
          const startOffset = chunkXIndex === 0 ? firstChunkOffset : 0;
          const firstZ = Math.max(0, Math.floor((worldZ - startOffset) / chunkLength) - 1);
          const lastZ = Math.max(0, Math.floor((worldZ + 200 - startOffset) / chunkLength));
          for (let chunkZIndex = firstZ; chunkZIndex <= lastZ; chunkZIndex++) {
            const chunkKey = `${chunkXIndex}:${chunkZIndex}`;
            neededChunks.add(chunkKey);
            if (!worldChunks.has(chunkKey)) createWorldChunk(chunkXIndex, chunkZIndex);
          }
        }
        for (const chunkKey of worldChunks.keys()) {
          if (!neededChunks.has(chunkKey)) removeWorldChunk(chunkKey);
        }

            side: THREE.DoubleSide
          })
        );
        imprint.rotation.x = Math.PI / 2;
        group.add(imprint);
        scene.add(group);
        footprints.push({ group, material: imprint.material, time });
        stepSide *= -1;
        if (footprints.length > 72) {
          const oldest = footprints.shift();
          scene.remove(oldest.group);
          oldest.material.dispose();

      function renderInventory() {
        const totalFinds = Array.from(inventory.values()).reduce((total, entry) => total + entry.count, 0);
        inventoryCount.textContent = `${totalFinds} ${totalFinds === 1 ? "find" : "finds"}`;
        if (inventory.size === 0) {
          inventoryItems.innerHTML = '<span class="inventory-empty">Nothing collected yet</span>';
          return;
        }
        inventoryItems.replaceChildren(...Array.from(inventory, ([type, entry]) => {
          const chip = document.createElement("span");
          chip.className = "inventory-chip";
          chip.textContent = `${entry.icon} ${type} ×${entry.count}`;
          return chip;
        }));
      }

      function collectNearbyItem() {
        if (!inspecting || !nearbyCollectible) return;

        item.collected = true;
        if (item.id) collectedItemIds.add(item.id);
        item.group.parent.remove(item.group);
        disposeObjectResources(item.group);
        const current = inventory.get(item.type) || { icon: item.icon, count: 0 };
        current.count++;
        inventory.set(item.type, current);
        renderInventory();
        nearbyCollectible = null;
      }

      document.querySelector("#reset").addEventListener("click", () => {

        sea.position.set(0, 0.12, -49);

        sea.visible = true;
        keys.clear();
        movementVelocity.set(0, 0, 0);
        forwardVelocity = 0;
        turnVelocity = 0;
        sprintHeld = false;
        splashDrops.forEach((drop) => { drop.visible = false; });
        ripples.forEach((ripple) => { ripple.visible = false; });
        footprints.forEach(({ group, material }) => {
          scene.remove(group);

        footprints.length = 0;
        stepDistance = 0;

      const clock = new THREE.Clock();
      const desiredCamera = new THREE.Vector3();
      function resize() {
        const width = window.innerWidth;
        const height = window.innerHeight;
        renderer.setSize(width, height, false);
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
      }
      window.addEventListener("resize", resize);
      resize();

      function animate() {
        requestAnimationFrame(animate);
        const delta = Math.min(clock.getDelta(), 0.04);
        const time = clock.elapsedTime;
        const turnInput = (keys.has("left") ? 1 : 0) - (keys.has("right") ? 1 : 0);
        const forwardInput = (keys.has("up") ? 1 : 0) - (keys.has("down") ? 1 : 0);
        const turning = turnInput !== 0;
        const moving = forwardInput !== 0;
        const currentWaterDepth = Math.max(0, shoreZ(character.position.x) - character.position.z);
        const currentlySwimming = THREE.MathUtils.smoothstep(currentWaterDepth, 1.8, 3.1) > 0.5;
        const turnRate = currentlySwimming ? 1.55 : 2.65;
        const turnBlend = 1 - Math.exp(-(turning ? 9 : 13) * delta);
        turnVelocity += (turnInput * turnRate - turnVelocity) * turnBlend;
        character.rotation.y += turnVelocity * delta;

        const forwardSpeed = currentlySwimming ? 3 : sprintHeld ? 7.8 : 4.8;
        const reverseSpeed = currentlySwimming ? 1.05 : 1.45;
        const targetSpeed = forwardInput > 0
          ? forwardSpeed
          : forwardInput < 0
            ? -reverseSpeed
            : 0;
        const acceleration = forwardInput === 0 ? 8 : Math.sign(targetSpeed) !== Math.sign(forwardVelocity) ? 12 : 7;
        forwardVelocity += (targetSpeed - forwardVelocity) * (1 - Math.exp(-acceleration * delta));
        movementVelocity.set(
          Math.sin(character.rotation.y) * forwardVelocity,
          0,
          Math.cos(character.rotation.y) * forwardVelocity
        );
        const actualSpeed = Math.hypot(movementVelocity.x, movementVelocity.z);
        if (actualSpeed > 0.12) {
          const onDrySand = character.position.z > shoreZ(character.position.x) + 0.3;
          if (onDrySand) {
            stepDistance += actualSpeed * delta;
            while (stepDistance >= 0.58) {
              stepDistance -= 0.58;
              addFootprint(
                character.position.x,
                character.position.z,
                Math.atan2(movementVelocity.x, movementVelocity.z),
                time
              );
            }
          } else {
            stepDistance = 0;
          }
        } else {
          stepDistance = 0;
        }
        character.position.x += movementVelocity.x * delta;
        character.position.z += movementVelocity.z * delta;
        updateWorldChunks(character.position.x, character.position.z);
        const waterDepth = Math.max(0, shoreZ(character.position.x) - character.position.z);
        const swimAmount = THREE.MathUtils.smoothstep(waterDepth, 1.8, 3.1);
        const swimming = swimAmount > 0.5;
        const seaCenterZ = waterDepth > 0
          ? character.position.z - 49
          : shoreZ(character.position.x) - 49;
        sea.position.set(character.position.x, 0.12, seaCenterZ);
        seabed.position.set(character.position.x, -2.4, seaCenterZ);
        canInspect = !swimming && waterDepth < 0.3;
        if (!canInspect) inspecting = false;
        inspectMix += ((inspecting ? 1 : 0) - inspectMix) * (1 - Math.exp(-7 * delta));
        inspectButton.disabled = !canInspect;
        if (inspectButton.getAttribute("aria-pressed") !== String(inspecting)) {
          inspectButton.innerHTML = `<kbd>I</kbd> &nbsp; ${inspecting ? "Stand up" : "Inspect"}`;
          inspectButton.setAttribute("aria-pressed", String(inspecting));
          inspectButton.setAttribute("aria-label", inspecting ? "Stand up from inspecting the sand" : "Inspect the sand");
        }
        pickupButton.hidden = !inspecting || !nearbyCollectible;

        canDive = swimming;
        if (!canDive) isDiving = false;
        diveButton.disabled = !canDive;
        if (diveButton.getAttribute("aria-pressed") !== String(isDiving)) {
          diveButton.innerHTML = `<kbd>U</kbd> &nbsp; ${isDiving ? "Surface" : "Dive"}`;
          diveButton.setAttribute("aria-pressed", String(isDiving));
          diveButton.setAttribute("aria-label", isDiving ? "Surface from underwater" : "Dive underwater");
        }
        underwaterOverlay.classList.toggle("active", isDiving);
        sea.visible = !isDiving;
        const groundHeight = terrainHeight(character.position.x, character.position.z);
        const waveHeight =
          Math.sin(character.position.x * 0.24 + time * 1.2) * 0.045 +
          Math.sin(character.position.z * 0.18 - time * 0.85) * 0.035;
        const surfaceY = 0.12 + waveHeight;
        const standingY = THREE.MathUtils.lerp(groundHeight, surfaceY + 0.48, swimAmount);
        const swimBob = swimming ? Math.sin(time * 5) * 0.055 : 0;
        character.position.y = (isDiving ? surfaceY - 1.15 : standingY) + swimBob;
        const swimPitch = forwardVelocity < -0.12 ? -1.2 : 1.2;
        character.rotation.x = THREE.MathUtils.lerp(0, swimPitch, swimAmount);
        character.rotation.z = THREE.MathUtils.lerp(0, turnVelocity * 0.08, swimAmount);
        if (sprintButton.getAttribute("aria-pressed") !== String(sprintHeld)) {
          sprintButton.setAttribute("aria-pressed", String(sprintHeld));
        }
        if (actualSpeed > 0.12 && !swimming) {
          character.position.y += Math.abs(Math.sin(time * (8 + actualSpeed * 1.3))) * 0.08 * (1 - swimAmount);
        }
        if (actualSpeed <= 0.12 && !swimming) character.position.y += Math.sin(time * 2.4) * 0.025;

        head.position.y = THREE.MathUtils.lerp(1.78, 1.4, inspectMix);
        head.rotation.x = inspectMix * 0.22;
        torso.position.y = THREE.MathUtils.lerp(1.02, 0.72, inspectMix);
        torso.rotation.x = inspectMix * 0.42;
        shortsMesh.position.y = THREE.MathUtils.lerp(0.48, 0.34, inspectMix);

        const limbSwing = Math.sin(time * (5 + actualSpeed * 1.2)) *
          Math.min(0.52, actualSpeed * 0.11) * Math.sign(forwardVelocity);
        limbs.forEach(({ mesh, side, type, baseY }) => {
          const swimStroke = type === "arm"
            ? Math.sin(time * 7 + (side < 0 ? Math.PI : 0)) * 0.62
            : Math.sin(time * 11 + (side < 0 ? Math.PI : 0)) * 0.24;
          const swing = swimming
            ? swimStroke
            : actualSpeed > 0.12
              ? limbSwing * (type === "arm" ? 1 : -1) * side
              : 0;
          const inspectPose = type === "arm" ? 0.72 : -0.7;
          mesh.position.y = baseY - inspectMix * (type === "arm" ? 0.2 : 0.04);
          mesh.rotation.x = THREE.MathUtils.lerp(swing, inspectPose, inspectMix);
          mesh.rotation.z = THREE.MathUtils.lerp(
            swimming && type === "arm" ? side * (0.38 + Math.sin(time * 7) * 0.12) : 0,
            type === "arm" ? side * 0.16 : 0,
            inspectMix
          );
        });

        nearbyCollectible = null;
        let closestDistance = 2.4;
        for (const item of collectibles) {
          if (item.collected) continue;
          const distance = Math.hypot(
            item.group.position.x - character.position.x,
            item.group.position.z - character.position.z
          );
          const highlighted = inspecting && distance < 6;
          item.group.traverse((part) => {
            if (part.material && "emissiveIntensity" in part.material) {
              part.material.emissiveIntensity = highlighted && distance < 3 ? 0.12 : 0;
            }
          });
          if (inspecting && distance < closestDistance) {
            closestDistance = distance;
            nearbyCollectible = item;
          }
        }
        pickupButton.hidden = !inspecting || !nearbyCollectible;
        const pickupLabel = nearbyCollectible ? `E  ·  Pick up ${nearbyCollectible.type}` : "";
        if (pickupButton.textContent !== pickupLabel) {
          pickupButton.textContent = pickupLabel;
          if (nearbyCollectible) pickupButton.setAttribute("aria-label", `Pick up ${nearbyCollectible.type}`);
        }

        const shallowWaterMovement = actualSpeed > 0.12 && waterDepth > 0.25 && !swimming;
        if (shallowWaterMovement && time >= nextSplash) {
          const drop = splashDrops[splashIndex++ % splashDrops.length];
          drop.visible = true;
          drop.position.set(
            character.position.x + (Math.random() - 0.5) * 0.65,
            surfaceY + 0.08,
            character.position.z + (Math.random() - 0.5) * 0.65
          );
          drop.userData.velocity.set((Math.random() - 0.5) * 1.8, 1.1 + Math.random() * 1.5, (Math.random() - 0.5) * 1.8);
          drop.userData.life = 0.55 + Math.random() * 0.2;
          nextSplash = time + 0.09;
        }
        for (const drop of splashDrops) {
          if (!drop.visible) continue;
          drop.userData.life -= delta;
          drop.position.addScaledVector(drop.userData.velocity, delta);
          drop.userData.velocity.y -= 4.5 * delta;
          if (drop.userData.life <= 0) drop.visible = false;
        }
        ripples.forEach((ripple) => {
          ripple.visible = swimming;
          if (!swimming) return;
          const phase = (time * 0.65 + ripple.userData.phase) % 1;
          const size = 0.5 + phase * 1.7;
          ripple.position.set(character.position.x, surfaceY + 0.025, character.position.z);
          ripple.scale.set(size, size, size);
          ripple.material.opacity = (1 - phase) * 0.4;
        });

        if (waterShader) waterShader.uniforms.uTime.value = time;

        foamLines.forEach((line) => {
          line.position.z = Math.sin(time * 0.7 + line.userData.offset) * 0.24;
          line.material.opacity = 0.58 + Math.sin(time * 1.5 + line.userData.offset) * 0.16;
        });
        const forward = new THREE.Vector3(
          Math.sin(character.rotation.y),
          0,
          Math.cos(character.rotation.y)
        );
        let cameraTarget = new THREE.Vector3(
          character.position.x + forward.x * 2.4,
          isDiving ? character.position.y + 0.1 : character.position.y + 0.9,
          character.position.z + forward.z * 2.4
        );
        desiredCamera.set(
          character.position.x - forward.x * cameraFollowDistance,
          isDiving ? Math.min(character.position.y + 2.6, surfaceY - 0.3) : character.position.y + cameraFollowHeight,
          character.position.z - forward.z * cameraFollowDistance
        );
        if (inspectMix > 0.001) {
          const groundTarget = new THREE.Vector3(
            character.position.x + forward.x * 2.4,
            0,
            character.position.z + forward.z * 2.4
          );
          groundTarget.y = terrainHeight(groundTarget.x, groundTarget.z) + 0.12;
          const closeCamera = new THREE.Vector3(
            character.position.x - forward.x * 6.2,
            character.position.y + 4.8,
            character.position.z - forward.z * 6.2
          );
          desiredCamera.lerp(closeCamera, inspectMix);
          cameraTarget.lerp(groundTarget, inspectMix);
        }
        camera.position.lerp(desiredCamera, 1 - Math.exp(-7 * delta));
        camera.lookAt(cameraTarget);
        renderer.render(scene, camera);
      }
      animate();
    })();
  </script>
</body>
</html>
